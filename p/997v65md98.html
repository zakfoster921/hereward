<body>
<svg class="noodle" id="noodle" aria-hidden="true" focusable="false"><g id="noodle-bits"></g><path id="noodle-path" d=""/></svg>
<div class="wrap">
  <div id="flow">
    <div class="top"><ol class="gates" id="gates" aria-label="Progress through the four gates"></ol></div>
    <div class="cascade" id="cascade"></div>
    <div class="tail" aria-hidden="true"></div>
  </div>
</div>
<script>window.QA_ROOT = '../';</script>
<script src="../shared/art.js?v=481825fa"></script>
<script src="../shared/gates.js?v=5471cf06"></script>
<script>
window.PROMPT = {
  n: 1,
  label: "TEST PROMPT",
  name: "A Window You\u2019ve Spent Real Time At",
  subject: "window",
  g1: {
    title: "Free-Write",
    aim: "Start with a window, and add whatever it leads you to in your quilt.",
    lead: "Think of a window you\u2019ve spent real time at: waiting, working, watching, or just being. Choose a window you couldn\u2019t describe without also describing a stretch of your life.",
    asks: [
      "Are you inside looking out, or outside looking in?",
      "What can you see through it?",
      "What do you usually find yourself doing there?"
    ],
    stuck: "If nothing arrives, list rooms where you\u2019ve spent long stretches (a kitchen, a desk, a car, a classroom). Stop at the one with a window you remember."
  },
  g1b: {
    intro: "Fill each column with what\u2019s around this window.",
    cols: ["Hear", "Smell", "Touch"]
  },
  g1c: {
    title: "What it shows",
    intro: "Complete the sentence below that opens up this window\u2019s place in your life.",
    starters: [
      "This window has shown me\u2026",
      "This window is where I\u2026",
      "When I step away from it, I carry\u2026"
    ],
    stuck: "Write as if the window could talk, and finish the lines from its side."
  },
  g4: {
    exampleTop: "\u201cA window with a view of a street\u201d sits near Universal and Faint.",
    exampleBottom: "Adding \u201cthe one pane you kept wiping clear,\u201d for the charge \u201cI was always watching for someone to come home,\u201d moves it toward Strong or Personal.",
    stuck: "What would you point out if you were showing someone this window?",
    collapse: true
  },
  closing: {
    line: "Add what you found at your window to your quilt.",
    guide: "Stop when it feels true, not when it feels finished."
  }
};
</script>
<script>window.QA.mode = 'prompt'; window.QA.G = window.QA.buildGates(window.PROMPT);</script>
<script src="../shared/engine.js?v=7e0fc4c4"></script>
<script>document.querySelectorAll(".prompt-tag").forEach(function (t) { t.textContent = window.PROMPT.label; });</script>
</body></html>
