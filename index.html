<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<title>Through-It-All Quilt-Along</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: one scrolling column of gate cards. Steps inside a gate reveal on tap and stay above, faded.
   When a gate is passed, it folds into a slim row and the next gate opens with its own card. */
:root {
  --bg: #ECE7F1;
  --paper: #F7F4FA;
  --ink: #3B3050;
  --muted: #74698A;
  --line: #D3CBE0;
  --thread: #7A62A3;
  --on-ink: #F7F4FA;
  --blue: #a5dbec;
  --green: #b8d2b2;
  --orange: #f7dcba;
  --pink: #f5b1ae;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1929;
    --paper: #292236;
    --ink: #ECE7F4;
    --muted: #B4AACA;
    --line: #463C5C;
    --thread: #C4B2E3;
    --on-ink: #1E1929;
    --blue: #a5dbec;
    --green: #b8d2b2;
    --orange: #f7dcba;
    --pink: #f5b1ae;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1929;
  --paper: #292236;
  --ink: #ECE7F4;
  --muted: #B4AACA;
  --line: #463C5C;
  --thread: #C4B2E3;
  --on-ink: #1E1929;
  --blue: #a5dbec;
  --green: #b8d2b2;
  --orange: #f7dcba;
  --pink: #f5b1ae;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.6;
  padding-inline: 1rem;
  padding-block: 0.75rem 2.5rem;
}
.wrap { max-width: 38rem; margin-inline: auto; display: flex; flex-direction: column; gap: 0.75rem; }

.eyebrow {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}

/* Sticky progress: one line, divided by gate */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 0.6rem;
}
.gates { display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; }
.gate-seg { min-width: 0; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: var(--thread); transition: width 0.4s ease; }

/* Gate cards */
.cascade { display: flex; flex-direction: column; gap: 0.75rem; }
.gate {
  background: var(--bg);
  border-radius: 3px;
  padding: 0.75rem 1.5rem 2rem;
  scroll-margin-top: 3rem;
  animation: arrive 0.3s ease both;
}
.gate p { margin: 0; max-width: 34rem; }
.gate-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
.gate-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.9rem;
  line-height: 1.15;
  letter-spacing: -0.01em;
  text-wrap: balance;
  margin: 0.3rem 0 0;
}
h1.gate-title { font-size: 2.3rem; }
.gate-title:focus { outline: none; }
.gate.is-collapsed { padding-block: 1rem; }
.gate.is-collapsed .gate-title, .gate.is-collapsed h1.gate-title { font-size: 1.1rem; margin-top: 0.1rem; }
.gate.is-collapsed .steps, .gate.is-collapsed .go { display: none; }
.toggle {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 0.85rem;
  color: var(--muted);
  background: none;
  border: 0;
  border-bottom: 1px dashed var(--muted);
  padding: 0.1rem 0;
  cursor: pointer;
  flex-shrink: 0;
}
.toggle:hover { color: var(--ink); border-bottom-style: solid; }

/* Steps */
.steps { display: flex; flex-direction: column; margin-top: 1.5rem; }
.step + .step { margin-top: 1.5rem; padding-top: 1.5rem; }
.step {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
  scroll-margin-top: 3rem;
  transition: opacity 0.35s ease;
  animation: arrive 0.3s ease both;
}
.step.is-past { opacity: 0.5; }
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.step h3 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.45rem;
  line-height: 1.2;
  letter-spacing: -0.01em;
  text-wrap: balance;
  margin: 0;
}
.step h3:focus { outline: none; }
.lead { font-weight: 600; }
.gate p.rule { border-left: 3px solid var(--thread); padding-left: 1rem; }
.quiet { color: var(--muted); }
.gate p.ask {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.5rem;
  line-height: 1.3;
  letter-spacing: -0.01em;
  text-wrap: balance;
  margin-block: 0.5rem;
  max-width: 30rem;
  border-left: 3px solid var(--thread);
  padding-left: 1rem;
}
.gate a.steplink { color: inherit; text-decoration: underline dashed; text-decoration-color: var(--muted); text-decoration-thickness: 1px; text-underline-offset: 0.25em; }
.gate a.steplink:hover { color: var(--thread); }
.gate p.ask.noline { border-left: 0; padding-left: 0; text-align: center; margin-inline: auto; }
.gate .asklist {
  margin-block: 0.25rem;
  max-width: 30rem;
}
.gate .asklist ul { margin: 0; padding-left: 1.25rem; display: grid; gap: 0.5rem; }
.gate .asklist li::marker { color: var(--thread); }
.quote {
  margin: 0;
  padding: 1rem 1.1rem;
  background: var(--paper);
  border-radius: 4px;
  color: var(--muted);
  font-style: italic;
}
.gate-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.35rem; font-family: var(--font-display); font-weight: 500; }
.gate-list li { display: flex; gap: 0.75rem; align-items: baseline; }
.gate-list .k { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; min-width: 4.2rem; }

/* The intro card and its opening text simply appear; only the gate list and goal build in */
.gate[data-g="0"], .gate[data-g="0"] .step,
.gate[data-g="1"], .gate[data-g="1"] .step[data-s="0"] { animation: none; }

/* Intro appears piece by piece on load */
.seq { animation: rise 0.7s ease both; animation-delay: var(--d, 0s); }
/* Question blocks (violet line) fade in together, as one group, a beat after their step arrives */
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.gate p.ask { animation: fadein 1s ease both; animation-delay: 0.6s; }
.gate p.ask[data-t] { animation: none; }
.ask .q { display: block; animation: fadein 0.7s ease both; }
.ask .q + .q { margin-top: 1.4em; }
[data-t][hidden], .step[hidden] { display: none !important; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.note summary {
  color: var(--muted);
  display: inline-block;
  list-style: none;
  cursor: pointer;
  font-family: var(--font-display);
  font-weight: 400;
  font-style: italic;
  font-size: 1rem;
  border-bottom: 1px dashed var(--muted);
  padding: 0.1rem 0;
}
.note summary::-webkit-details-marker { display: none; }
.note summary:hover { border-bottom-style: solid; color: var(--ink); }
.note summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.note { text-align: right; }
.gate .note p { margin-top: 0.6rem; text-align: left; font-style: italic; color: var(--muted); }

.stuck { padding-top: 0.25rem; text-align: right; }
.stuck-btn {
  font: inherit;
  font-family: var(--font-display);
  font-weight: 400;
  font-style: italic;
  font-size: 1rem;
  background: none;
  color: var(--muted);
  border: 0;
  border-bottom: 1px dashed var(--muted);
  padding: 0.1rem 0;
  cursor: pointer;
}
.stuck-btn:hover { border-bottom-style: solid; color: var(--ink); }
.gate p.stuck-text { margin-top: 0.6rem; text-align: left; font-style: italic; color: var(--muted); }

.ways { border-top: 1px solid var(--line); }
.ways details { border-bottom: 1px solid var(--line); }
.ways summary {
  color: var(--ink);
  font-style: italic;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.15rem;
  padding: 0.85rem 0;
  cursor: pointer;
  list-style: none;
  display: flex;
  justify-content: space-between;
  gap: 1rem;
}
.ways summary::-webkit-details-marker { display: none; }
.ways summary::after { content: "+"; color: var(--muted); font-weight: 500; }
.ways details[open] summary::after { content: "\2013"; }
.ways summary:hover { color: var(--ink); }
.ways details p { padding-bottom: 1rem; color: var(--ink); }

.matrix-wrap { position: relative; width: 100%; max-width: 26rem; margin-inline: auto; }
.matrix { width: 100%; height: auto; display: block; border-radius: 6px; }
/* The drawing has black arrows, so in dark mode it sits on a white card */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .matrix { background: #fff; } }
:root[data-theme="dark"] .matrix { background: #fff; }
/* Four tap targets laid over the colored corners of the drawing */
.quad { position: absolute; display: flex; align-items: center; justify-content: center; padding: 0; font: inherit; border: 0; background: transparent; cursor: pointer; border-radius: 2px; -webkit-tap-highlight-color: transparent; }
.quad-blue   { left: 4.4%;  top: 4.7%;  width: 44.6%; height: 44.2%; }
.quad-green  { left: 51.0%; top: 4.7%;  width: 45.2%; height: 44.1%; }
.quad-orange { left: 4.8%;  top: 50.7%; width: 44.2%; height: 44.7%; }
.quad-pink   { left: 51.0%; top: 50.7%; width: 45.2%; height: 44.7%; }
.quad:hover { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35); }
.quad[aria-pressed="true"] { box-shadow: none; }
.matrix-wrap.has-sel .quad:not([aria-pressed="true"]) { background: rgba(255,255,255,0.6); }
.quad:focus-visible { outline: 3px solid #000; outline-offset: -3px; }
@keyframes hint { 0%, 100% { box-shadow: inset 0 0 0 2px rgba(0,0,0,0); } 50% { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4); } }
.quad:not([aria-pressed="true"]) { animation: hint 1.4s ease 1; }
.quad-blue { animation-delay: 0.6s; } .quad-green { animation-delay: 0.9s; } .quad-pink { animation-delay: 1.2s; } .quad-orange { animation-delay: 1.5s; }
.iconlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; }
.iconlist li { border-left: 3px solid var(--thread); padding-left: 1rem; }
.example-card { text-align: center; font-family: var(--font-display); line-height: 1.5; }
.example-card p { margin: 0; }
.example-card .ex-top { background: color-mix(in srgb, var(--thread) 16%, var(--bg)); padding: 1.1rem 1.1rem 1.2rem; }
.example-card .ex-label { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 0.35rem; }
.example-card .ex-bottom { background: var(--thread); color: var(--on-ink); padding: 1.2rem 1.1rem 1.3rem; }
.reserve { display: flex; flex-direction: column; gap: 1.1rem; }
.gate-art-wrap { display: flex; justify-content: center; margin-top: 1.5rem; }
.gate-art { width: 6.5rem; height: auto; color: var(--muted); opacity: 0.55; }
.gate-art.senses-art { width: 13rem; }
.step > .gate-art-wrap:first-child { margin-top: 0; }
/* A drawing that follows only a short paragraph or list (Gate 2, the intro, the closing card) gets extra room above it */
.step > p + .gate-art-wrap, .step > ol + .gate-art-wrap { margin-top: 3rem; }
/* Keep the words clear of the black arrows: toward the outer edge, away from the center lines */
.quad-blue, .quad-orange { padding-right: 1.5rem; padding-left: 0.6rem; }
.quad-green, .quad-pink { padding-left: 1.5rem; padding-right: 0.6rem; }
.quad-blue, .quad-green { padding-bottom: 1rem; }
.quad-orange, .quad-pink { padding-top: 1rem; }
.quad-text { display: none; font-family: var(--font-display); font-size: clamp(0.78rem, 4vw, 1rem); line-height: 1.3; text-align: center; color: #2A2233; animation: fadein 0.4s ease both; pointer-events: none; }
.quad[aria-pressed="true"] .quad-text { display: block; }
.quad-row { display: grid; grid-template-columns: 0.9rem 1fr; gap: 0.7rem; align-items: baseline; animation: fadein 0.4s ease both; }
.gate .quad-slot p.invite { color: var(--muted); font-style: italic; animation: fadein 0.4s ease both; }
.matrix text { font-family: var(--font-display); font-size: 12px; fill: var(--muted); }
.matrix .axis { stroke: var(--muted); stroke-width: 1.2; }
.ph-note { font-size: 0.82rem; text-align: center; color: var(--muted); font-style: italic; }
.key { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; font-size: 1rem; }
.key li { display: grid; grid-template-columns: 0.9rem 1fr; gap: 0.7rem; align-items: baseline; min-width: 0; }
.swatch { width: 0.9rem; height: 0.9rem; border-radius: 1px; transform: translateY(0.12rem); }

/* Continue / pass through */
.go { margin-top: 1.75rem; border-top: 1px solid transparent; }
.cue {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 3.25rem;
  background: none;
  border: 0;
  border-radius: 3px;
  color: var(--muted);
  cursor: pointer;
  --nudge: 5px;
}
.cue.up { --nudge: -5px; }
.cue:hover { color: var(--ink); }
.cue:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.cue-icon { display: inline-flex; animation: nudge 2.4s ease-in-out infinite; }
.cue svg { width: 1.6rem; height: 1.6rem; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cue.up svg { transform: rotate(180deg); }
@keyframes nudge {
  0%, 100% { transform: translateY(0); opacity: 0.5; }
  50% { transform: translateY(var(--nudge)); opacity: 1; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
  padding: 0.7rem 1.4rem;
  border-radius: 3px;
  border: 1px solid var(--ink);
  cursor: pointer;
  background: var(--ink);
  color: var(--on-ink);
}
.btn:focus-visible, .stuck-btn:focus-visible, .toggle:focus-visible, .ways summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* Closing card: inverted so it reads as the end */
.gate .big { font-family: var(--font-display); font-weight: 500; font-size: 1.4rem; line-height: 1.4; text-wrap: balance; }
.gate.closing { background: var(--ink); color: var(--on-ink); padding-top: 1.75rem; }
.gate.closing .eyebrow { color: var(--on-ink); opacity: 0.7; }
.gate.closing .gate-art { color: var(--on-ink); opacity: 0.6; width: 6.5rem; }
.gate.closing .cue { color: var(--on-ink); }
.gate.closing .cue:hover { opacity: 0.8; }
.gate.closing .cue:focus-visible { outline-color: var(--on-ink); }

/* Title screen: centered, one idea, Skip intro sits at the bottom */
.title {
  min-height: calc(100vh - 3rem);
  min-height: calc(100dvh - 3rem);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
  padding-block: 1.5rem 0.5rem;
  text-align: center;
}
.title-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; min-width: 0; }
.title h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 3rem;
  line-height: 1.06;
  letter-spacing: -0.02em;
  text-wrap: balance;
  margin: 0;
}
.title h1:focus { outline: none; }
.title .sub { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; color: var(--muted); margin: 0; text-wrap: balance; }
.title .gate-art-wrap { margin-top: 0; }
.title .gate-art { width: 8.5rem; opacity: 0.7; }
.title .btn { margin-top: 0.75rem; padding: 0.85rem 2.2rem; }
.title-foot { padding-bottom: 1rem; }
@media (max-width: 480px) { .title h1 { font-size: 2.3rem; } }

/* Room below the last section so a new one can scroll to the top */
.tail { height: 65vh; }

@media (max-width: 480px) {
  body { font-size: 1.05rem; }
  .gate { padding: 0.6rem 1.1rem 1.6rem; }
  .gate.is-collapsed { padding-block: 0.9rem; }
  h1.gate-title { font-size: 1.9rem; }
  .gate-title { font-size: 1.55rem; }
  .step h3 { font-size: 1.3rem; }
  .gate p.ask { font-size: 1.3rem; }
}
@media (prefers-reduced-motion: reduce) {
  .gate, .step { animation: none; transition: none; }
  .bar-fill { transition: none; }
  .cue-icon { animation: none; }
  .seq, .gate p.ask, .ask .q, .quad, .quad-row, .gate .quad-slot p.invite { animation: none; }
}
</style>

<div class="wrap">
  <section class="title" id="title" aria-labelledby="title-h">
    <div class="title-main">
      <div class="seq" style="--d:0.1s" id="title-art"></div>
      <h1 id="title-h" class="seq" style="--d:0.35s">Through-It-All Quilt-Along</h1>
      <p class="sub seq" style="--d:0.6s">One quilt, one year of prompts.</p>
      <button class="btn seq" style="--d:0.85s" id="begin" type="button">Begin</button>
    </div>
    <div class="title-foot seq" style="--d:1.1s"><button class="toggle" id="skip" type="button">Skip intro</button></div>
  </section>
  <div id="flow" hidden>
    <div class="top"><ol class="gates" id="gates" aria-label="Progress through the four gates"></ol></div>
    <div class="cascade" id="cascade"></div>
    <div class="tail" aria-hidden="true"></div>
  </div>
</div>

<script>
(function () {
  // A violet-line question group: each question appears on its own tap
  function asks(qs) {
    return '<p class="ask" data-t="1" hidden>' + qs.map(function (q, i) {
      return '<span class="q" data-t="' + (i + 1) + '" hidden>' + q + '</span>';
    }).join('') + '</p>';
  }
  // Shows html together with the last question (tap n)
  function withTap(n, html) {
    return '<div class="seq" data-t="' + n + '" hidden style="--d:0.5s">' + html + '</div>';
  }

  function stuck(id, text) {
    return '<div class="stuck"><button class="stuck-btn" type="button" aria-expanded="false" aria-controls="' + id + '">Stuck?</button>' +
      '<p class="stuck-text" id="' + id + '" hidden>' + text + '</p></div>';
  }

  // The gate drawing that closes the first screen of every gate

        '<div class="seq" style="--d:1.1s">' +
        stuck("s-g1a", "If nothing arrives, list places you’ve lived or spent time, starting with the present and working backward. Stop when one resonates.") +
        '</div>' +
        '</div>' +
        '</div>' +
        GATE_ART,

        SENSES_ART +
        '<h3>Full body recall</h3>' +
        '<p>Sights, sounds, smells, and textures hold more than explanations do. Write in the present tense for more vivid details.</p>' +
        '<div class="reserve">' +
        asks(['What do you see, hear, and smell?', 'What do you feel underfoot?', 'Where exactly are you standing?']) +
        '</div>',

        DOODLE_ART +
        '<h3>What remains</h3>' +
        '<p>This is where the place stops being scenery and becomes yours. Start with the question below that feels generative.</p>' +
        '<div class="reserve">' +
        asks(['What did this landscape give you?', 'What did it take, or ask of you?', 'What did it teach you?']) +
        withTap(3, stuck("s-g1", "Write the landscape as a person in your life. Describe how they look and how they move.")) +
        '</div>'
      ]
    },
    {
      eyebrow: "Gate 2", name: "Deepen the charge",
      steps: [
        '<p>Read over your writing and <u><em>underline the detail</em></u> that pulls at you most. That detail carries <strong>your charge</strong>: the emotional current that makes it matter to you.</p>' +
        GATE_ART,
        '<h3>Follow where it points</h3>' +
        SIGNPOST_ART +
        '<p>A detail is often a doorway to something larger. Let your mind follow it a little further.</p>' +
        '<div class="reserve">' +
        asks(['Picture the detail you underlined as a <strong>signpost</strong>.', '<em>What is it pointing you toward?</em>']) +
        withTap(2, stuck("s-g2", "Finish this sentence: Underneath this detail is…")) +
        '</div>'
      ]
    },
    {
      eyebrow: "Gate 3", name: "Visualize the charge",
      steps: [
        '<h3>Choose a way in</h3>' +
        '<p>Your free-write is full of specific words and images that can carry your charge.</p>' +
        '<div class="ways">' +
        '<details class="seq" style="--d:0.5s" name="way"><summary>Start with a thing</summary><p>Which one in your writing holds your charge best? Sketch it or imagine it.</p></details>' +
        '<details class="seq" style="--d:1.1s" name="way"><summary>Start with your fabrics</summary><p>Look through what you have. Which one feels like it can carry your charge? What about it: color, texture, pattern?</p></details>' +
        '<details class="seq" style="--d:1.7s" name="way"><summary>Start with a word</summary><p>Choose a specific, personal word you wrote or that comes to mind. What makes this <em>your</em> word? How would you stitch it: what style, what size, what color?</p></details>' +
        '</div>' +
        '<div class="seq" style="--d:2.3s">' +
        stuck("s-g3", "Scan your writing again for a second detail that belongs with the first. Picture the two together.") +
        '</div>' +
        GATE_ART
      ]
    },
    {
      eyebrow: "Gate 4", name: "Test the charge",
      steps: [
        '<p>This matrix helps you reflect on how personal and how strong your image is. <strong>Tap a corner</strong> to see how each one works.</p>' +
        MATRIX +
        '<p class="ask noline">Where does your image currently land?</p>',

        '<h3>Does your image want to move to another part of the matrix?</h3>' +
        '<div class="reserve">' +
        '<ul class="iconlist">' + '<li class="seq" data-t="1" hidden style="--d:0s">To move toward <strong>Personal</strong>, add a detail only you would know</li>' + '<li class="seq" data-t="2" hidden style="--d:0s">To move toward <strong>Strong</strong>, return to your <a href="#" class="steplink" data-g="1" data-s="1">sensory writing</a> and find a detail that holds more of your charge</li>' + '<li class="seq" data-t="3" hidden style="--d:0s">If it holds up where it is, it’s time to start sewing</li>' + '</ul>' +
        '<div class="seq example-card" data-t="3" hidden style="--d:0.8s"><div class="ex-top"><p class="ex-label">Example</p><p>“A wide field at dusk” sits near Universal and Faint.</p></div><div class="ex-bottom"><p>Adding “the rusted gate you had to lift with both hands,” for the charge “nothing here opened easily,” moves it toward Strong or Personal.</p></div></div>' +
        '<div class="seq" data-t="3" hidden style="--d:1.6s">' + stuck("s-g4", "Ask: what is one thing in this landscape only you would know?") + '</div>' +
        '</div>' +
        GATE_ART
      ]
    },
    {
      eyebrow: "Prompt 1 complete", name: "Time to sew", closing: true,
      steps: [
        '<p class="big">You’ve done the thinking, and now you have something to make.</p>' +
        '<p>Your writing will always be here if you want to come back to it.</p>' +
        SCISSORS_ART
      ]
    }
  ];

  var cascade = document.getElementById("cascade");
  var gatesEl = document.getElementById("gates");

  cascade.innerHTML = G.map(function (g, gi) {
    var t = g.tag || "h2";
    return '<section class="gate' + (g.closing ? " closing" : "") + '" data-g="' + gi + '" hidden>' +
      '<div class="gate-top"><div>' + (g.eyebrow ? '<p class="eyebrow">' + g.eyebrow + '</p>' : '') +
      '<' + t + ' class="gate-title">' + g.name + '</' + t + '></div></div>' +
      '<div class="steps">' +
      g.steps.map(function (h, si) { return '<div class="step" data-s="' + si + '" hidden>' + h + '</div>'; }).join("") +
      '</div>' +
      '<div class="go"><button class="cue" type="button"><span class="cue-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span><span class="sr"></span></button></div></section>';
  }).join("");

  gatesEl.innerHTML = G.map(function (g, i) {
    if (i === 0 || g.closing) return "";
    return '<li class="gate-seg" style="flex:' + g.steps.length + ' 1 0"><div class="bar" title="' + g.name + '"><div class="bar-fill"></div></div></li>';
  }).join("");

  var gateEls = [].slice.call(cascade.querySelectorAll(".gate"));
  var fills = [].slice.call(gatesEl.querySelectorAll(".bar-fill"));
  var stage = "title", skipped = false;
  var titleEl = document.getElementById("title"), flowEl = document.getElementById("flow");
  document.getElementById("title-art").innerHTML = GATE_ART;
  var rg = 0, rs = 1, rt = 0; // rt: how many taps of a step's smaller reveals (data-t) are done

  function label() {
    var g = G[rg];
    if (rs < g.steps.length) return "Continue";
    if (rg === 0) return "Begin";
    if (G[rg + 1] && G[rg + 1].closing) return "Finish";
    if (rg < G.length - 1) return "Pass through to Gate " + (rg + 1);
    return "Back to the top";
  }

  // Hold the space the hidden pieces will fill, so anything below (like the gate drawing) never moves
  function reserveSpace(st) {
    [].slice.call(st.querySelectorAll(".reserve")).forEach(function (r) {
      r.style.minHeight = "0";
      var items = [].slice.call(r.querySelectorAll("[data-t]"));
      var was = items.map(function (el) { return el.hidden; });
      items.forEach(function (el) { el.hidden = false; });
      var h = r.offsetHeight;
      items.forEach(function (el, i) { el.hidden = was[i]; });
      r.style.minHeight = h + "px";
    });
  }
  // Size the senses drawing so the whole screen (title, drawing, text, questions, chevron) fits the viewport.
  // It never grows past 13rem and never shrinks below 6.5rem; call after reserveSpace so the questions' room is counted.
  function fitArt(st) {
    var svg = st.querySelector(".senses-art");
    if (!svg) return;
    var wrap = svg.parentNode;
    svg.style.width = "13rem";
    var maxW = svg.getBoundingClientRect().width;
    var avail = window.innerHeight - 48 - 64; // scroll margin above, chevron below
    var other = st.offsetHeight - wrap.offsetHeight + 24; // everything but the drawing, plus its top margin
    var w = (avail - other) * (1165 / 1190);
    w = Math.max(104, Math.min(maxW, w)); // never smaller than the original 6.5rem
    svg.style.width = w + "px";
  }
  function remeasure() {
    if (rt !== 0) return;
    var st = gateEls[rg] && gateEls[rg].querySelectorAll(".step")[rs - 1];
    if (st && !st.hidden) { reserveSpace(st); fitArt(st); }
  }
  window.addEventListener("resize", remeasure);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(remeasure);

  function sync() {
    gateEls.forEach(function (ge, g) {
      ge.hidden = g > rg || (skipped && g === 0);
      [].slice.call(ge.querySelectorAll(".step")).forEach(function (st, si) {
        var show = g < rg ? true : (g === rg && si < rs);
        st.hidden = !show;
        st.classList.toggle("is-past", g === rg && si < rs - 1);
        var current = g === rg && si === rs - 1;
        [].slice.call(st.querySelectorAll("[data-t]")).forEach(function (el) {
          el.hidden = current && +el.getAttribute("data-t") > rt;
        });
        if (current && rt === 0) { reserveSpace(st); fitArt(st); }
      });
      var go = ge.querySelector(".go");
      // The chevron shows whenever the next tap moves to a new screen (next step or next card), not while smaller reveals remain
      go.hidden = g !== rg || g === G.length - 1 || pendingTaps() > 0;
      if (g === rg) {
        var cue = go.firstChild;
        cue.querySelector(".sr").textContent = label();
        cue.classList.toggle("up", rg === G.length - 1);
      }
    });
    fills.forEach(function (f, k) {
      var i = k + 1, n = G[i].steps.length;
      var pct = i < rg ? 100 : (i === rg ? Math.round((rs / n) * 100) : 0);
      f.style.width = pct + "%";
    });
  }

  function scrollTo(target, isGate) {
    requestAnimationFrame(function () {
      var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { target.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); }
      catch (e) { target.scrollIntoView(); }
      var h = target.querySelector(isGate ? ".gate-title" : "h3");
      if (h) { h.setAttribute("tabindex", "-1"); try { h.focus({ preventScroll: true }); } catch (e) {} }
    });
  }

  function pendingTaps() {
    var st = gateEls[rg].querySelectorAll(".step")[rs - 1], max = 0;
    [].slice.call(st.querySelectorAll("[data-t]")).forEach(function (el) {
      max = Math.max(max, +el.getAttribute("data-t"));
    });
    return max - rt;
  }

  function advance() {
    var g = G[rg];
    if (pendingTaps() > 0) {
      rt++;
      sync();
      return;
    }
    rt = 0;
    if (rs < g.steps.length) {
      rs++;
      sync();
      scrollTo(gateEls[rg].querySelectorAll(".step")[rs - 1], false);
    } else if (rg < G.length - 1) {
      rg++;
      rs = 1;
      sync();
      scrollTo(gateEls[rg], true);
    } else {
      rg = 0; rs = 1; rt = 0; skipped = false; stage = "title";
      flowEl.hidden = true; titleEl.hidden = false;
      sync();
      window.scrollTo(0, 0);
    }
  }

  cascade.addEventListener("click", function (e) {
    var go = e.target.closest(".go .cue");
    if (go) { advance(); return; }
    var sl = e.target.closest("a.steplink");
    if (sl) {
      e.preventDefault();
      var tgt = gateEls[+sl.getAttribute("data-g")].querySelectorAll(".step")[+sl.getAttribute("data-s")];
      if (tgt && !tgt.hidden) {
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        try { tgt.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); } catch (err) { tgt.scrollIntoView(); }
        var hd = tgt.querySelector("h3");
        if (hd) { hd.setAttribute("tabindex", "-1"); try { hd.focus({ preventScroll: true }); } catch (err) {} }
      }
      return;
    }
    var q = e.target.closest(".quad");
    if (q) {
      var wrap = q.parentNode, info = document.getElementById("quad-info");
      var on = q.getAttribute("aria-pressed") === "true";
      [].slice.call(wrap.querySelectorAll(".quad")).forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
      wrap.classList.remove("has-sel");
      if (on) {
        info.textContent = "";
      } else {
        var d = QUADS[q.getAttribute("data-q")];
        q.setAttribute("aria-pressed", "true");
        wrap.classList.add("has-sel");
        info.textContent = d.name + " " + d.text;
      }
      return;
    }
    var b = e.target.closest(".stuck-btn");
    if (b) {
      var p = document.getElementById(b.getAttribute("aria-controls"));
      var open = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", open ? "false" : "true");
      p.hidden = open;
    }
  });

  // Tap anywhere to continue. Skips controls, text selection, and the last card (so a stray tap never restarts).
  document.addEventListener("click", function (e) {
    if (e.target.closest("button, summary, a, input, textarea, select, label")) return;
    if (stage === "title" || rg >= G.length - 1) return;
    var sel = window.getSelection && String(window.getSelection());
    if (sel) return;
    advance();
  });

  function enter(skip) {
    stage = "flow"; skipped = skip;
    rg = skip ? 1 : 0; rs = 1; rt = 0;
    titleEl.hidden = true; flowEl.hidden = false;
    window.scrollTo(0, 0);
    sync();
    scrollTo(gateEls[rg], true);
  }
  document.getElementById("begin").addEventListener("click", function () { enter(false); });
  document.getElementById("skip").addEventListener("click", function () { enter(true); });

  sync();
})();
</script>
</body></html>
